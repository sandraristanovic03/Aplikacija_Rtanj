<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest GIS Analysis - Rtanj Mountain 2016-2024</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        /* =========================================================================
           ROOT VARIABLES
           ========================================================================= */
        
        :root {
            --primary-green: #145A32;
            --secondary-green: #27AE60;
            --light-green: #90ee90;
            --dark-green: #006400;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --info: #3498DB;
            --forest-gain: #D500F9;
            
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --bg-dark: #1a1a1a;
            --bg-darker: #0f0f0f;
            --border-color: #333333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.6);
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --spacing-xxl: 32px;
            
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            --transition-fast: 0.15s ease;
            --transition-base: 0.3s ease;
            --transition-slow: 0.5s ease;
        }
        
        /* =========================================================================
           RESET & BASE
           ========================================================================= */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-darker);
            overflow: hidden;
        }
        
        /* =========================================================================
           MAIN CONTAINER
           ========================================================================= */
        
        .gis-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }
        
        .gis-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-green) 100%);
            color: white;
            padding: var(--spacing-lg) var(--spacing-xl);
            box-shadow: var(--shadow);
            z-index: 100;
            flex-shrink: 0;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        .header-title h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }
        
        .header-title p {
            font-size: 13px;
            opacity: 0.95;
            font-weight: 300;
        }
        
        .header-info {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }
        
        .info-badge {
            background: rgba(255, 255, 255, 0.3);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* =========================================================================
           CONTENT LAYOUT
           ========================================================================= */
        
        .gis-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .gis-sidebar {
            width: 360px;
            background: var(--bg-dark);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            overflow-x: hidden;
            flex-shrink: 0;
            box-shadow: var(--shadow);
            z-index: 50;
        }
        
        .gis-main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .gis-map {
            flex: 1;
            width: 100%;
        }
        
        /* =========================================================================
           SIDEBAR SECTIONS
           ========================================================================= */
        
        .sidebar-section {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-color);
        }
        
        .sidebar-section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--secondary-green);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* =========================================================================
           LAYER SELECTION (RADIO BUTTONS)
           ========================================================================= */
        
        .layer-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }
        
        .radio-label {
            display: flex;
            align-items: center;
            padding: var(--spacing-md);
            background: var(--bg-darker);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-base);
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .radio-label:hover {
            background: rgba(39, 174, 96, 0.05);
            border-color: var(--secondary-green);
        }
        
        .radio-label input[type="radio"] {
            width: 16px;
            height: 16px;
            margin-right: var(--spacing-md);
            cursor: pointer;
            accent-color: var(--secondary-green);
        }
        
        .radio-label input[type="radio"]:checked + .radio-text {
            color: var(--secondary-green);
            font-weight: 700;
        }
        
        .radio-label input[type="radio"]:checked {
            accent-color: var(--secondary-green);
        }
        
        .radio-label:has(input[type="radio"]:checked) {
            background: rgba(39, 174, 96, 0.1);
            border-color: var(--secondary-green);
            box-shadow: inset 0 0 0 1px var(--secondary-green);
        }
        
        .radio-text {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
            flex: 1;
        }
        
        .radio-text strong {
            color: var(--text-primary);
            display: block;
            font-weight: 600;
        }
        
        .radio-text small {
            font-size: 11px;
            color: var(--text-secondary);
            display: block;
        }
        
        /* =========================================================================
           LEGEND PANEL
           ========================================================================= */
        
        .legend-panel {
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: var(--spacing-md);
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
        }
        
        .legend-item:last-child {
            margin-bottom: 0;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }
        
        .legend-label {
            font-size: 12px;
            color: var(--text-secondary);
            flex: 1;
        }
        
        .legend-gradient {
            width: 100%;
            height: 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin-bottom: var(--spacing-sm);
        }
        
        .legend-gradient-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            padding: 0 var(--spacing-sm);
        }
        
        /* =========================================================================
           STATISTICS PANEL
           ========================================================================= */
        
        .stats-box {
            background: rgba(39, 174, 96, 0.05);
            border-left: 3px solid var(--secondary-green);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            border-radius: var(--radius-sm);
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: var(--spacing-sm) 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .stat-value {
            color: var(--secondary-green);
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        
        /* =========================================================================
           BUTTONS
           ========================================================================= */
        
        .btn {
            padding: var(--spacing-md) var(--spacing-lg);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-base);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #0f4229, #1e8449);
        }
        
        .btn-secondary {
            background: rgba(112, 112, 112, 0.3);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: rgba(112, 112, 112, 0.5);
        }
        
        /* =========================================================================
           STATUS BAR
           ========================================================================= */
        
        .status-bar {
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            font-size: 13px;
            flex-shrink: 0;
        }
        
        #statusText {
            color: var(--text-secondary);
            flex: 1;
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
        
        .status-bar.success #statusText {
            color: var(--success);
            font-weight: 600;
        }
        
        .status-bar.error #statusText {
            color: var(--danger);
            font-weight: 600;
        }
        
        /* =========================================================================
           LOADING INDICATOR
           ========================================================================= */
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }
        
        .loading-overlay.hidden {
            display: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            position: relative;
            margin-bottom: var(--spacing-lg);
        }
        
        .spinner-inner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(39, 174, 96, 0.3);
            border-top: 4px solid var(--secondary-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-overlay p {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 16px;
        }
        
        /* =========================================================================
           LEAFLET OVERRIDES (Dark Theme)
           ========================================================================= */
        
        .leaflet-control {
            border-radius: var(--radius-md);
            box-shadow: var(--shadow);
            background: var(--bg-dark) !important;
        }
        
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            background: var(--bg-dark) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--secondary-green) !important;
            font-size: 18px !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
        }
        
        .leaflet-control-zoom-in:hover,
        .leaflet-control-zoom-out:hover {
            background: rgba(39, 174, 96, 0.1) !important;
        }
        
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            background: var(--bg-dark);
        }
        
        .leaflet-popup-content {
            font-size: 13px;
            color: var(--text-primary);
        }
        
        .leaflet-popup-tip {
            background: var(--bg-dark);
        }
        
        .leaflet-attribution-flag {
            display: inline !important;
        }
        
        .leaflet-attribution {
            background: rgba(0, 0, 0, 0.5) !important;
            color: var(--text-secondary) !important;
            font-size: 11px;
        }
        
        .leaflet-attribution a {
            color: var(--secondary-green) !important;
        }
        
        /* =========================================================================
           RESPONSIVE DESIGN
           ========================================================================= */
        
        @media (max-width: 768px) {
            .gis-content {
                flex-direction: column;
            }
            
            .gis-sidebar {
                width: 100%;
                height: auto;
                max-height: 50vh;
                border-right: none;
                border-top: 1px solid var(--border-color);
                order: 2;
            }
            
            .gis-main {
                width: 100%;
                flex: 1;
                order: 1;
            }
            
            .header-content {
                flex-direction: column;
                gap: var(--spacing-lg);
                text-align: center;
            }
            
            .header-info {
                justify-content: center;
            }
            
            .header-title h1 {
                font-size: 22px;
                justify-content: center;
            }
            
            .sidebar-section {
                padding: var(--spacing-md);
            }
            
            .section-title {
                font-size: 12px;
            }
            
            .radio-label {
                padding: var(--spacing-sm);
                font-size: 12px;
            }
            
            .radio-text strong {
                font-size: 13px;
            }
            
            .radio-text small {
                font-size: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .header-title h1 {
                font-size: 18px;
                gap: var(--spacing-sm);
            }
            
            .header-title p {
                font-size: 11px;
            }
            
            .info-badge {
                font-size: 10px;
                padding: var(--spacing-xs) var(--spacing-sm);
            }
            
            .section-title {
                font-size: 11px;
            }
            
            .gis-sidebar {
                max-height: 45vh;
            }
        }
        
        /* =========================================================================
           ACCESSIBILITY
           ========================================================================= */
        
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        :focus-visible {
            outline: 2px solid var(--secondary-green);
            outline-offset: 2px;
        }
        
        button:focus-visible,
        select:focus-visible,
        input[type="radio"]:focus-visible {
            outline: 2px solid var(--secondary-green);
            outline-offset: -2px;
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- Main Container -->
    <div class="gis-container">
        <!-- Header -->
        <header class="gis-header">
            <div class="header-content">
                <div class="header-title">
                    <h1><i class="fas fa-tree"></i> Forest GIS Analysis</h1>
                    <p>Rtanj Mountain Ecosystem Monitoring 2016–2024</p>
                </div>
                <div class="header-info">
                    <span class="info-badge">Remote Sensing</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="gis-content">
            <!-- Sidebar -->
            <aside class="gis-sidebar">
                <!-- Layer Selection -->
                <div class="sidebar-section">
                    <h3 class="section-title">
                        <i class="fas fa-layer-group"></i> Forest Layers
                    </h3>
                    
                    <div class="layer-group">
                        <label class="radio-label">
                            <input type="radio" name="layer" value="ndvi" checked>
                            <span class="radio-text">
                                <strong>NDVI</strong>
                                <small>Vegetation Health Index</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="ndmi">
                            <span class="radio-text">
                                <strong>NDMI</strong>
                                <small>Moisture Content Index</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="nbr">
                            <span class="radio-text">
                                <strong>NBR</strong>
                                <small>Burn Ratio Index</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="savi">
                            <span class="radio-text">
                                <strong>SAVI</strong>
                                <small>Soil-Adjusted Index</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="forest-loss">
                            <span class="radio-text">
                                <strong>🔴 Forest Loss</strong>
                                <small>Deforestation Areas</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="forest-gain">
                            <span class="radio-text">
                                <strong>🟣 Forest Gain</strong>
                                <small>Reforestation Areas</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="deciduous">
                            <span class="radio-text">
                                <strong>🍂 Deciduous Forest</strong>
                                <small>Broadleaf Trees</small>
                            </span>
                        </label>
                        
                        <label class="radio-label">
                            <input type="radio" name="layer" value="coniferous">
                            <span class="radio-text">
                                <strong>🌲 Coniferous Forest</strong>
                                <small>Evergreen Trees</small>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- Legend -->
                <div class="sidebar-section">
                    <h3 class="section-title">
                        <i class="fas fa-map"></i> Legend
                    </h3>
                    <div id="legend-container" class="legend-panel">
                        <!-- Dynamically populated -->
                    </div>
                </div>

                <!-- Statistics Panel -->
                <div class="sidebar-section">
                    <h3 class="section-title">
                        <i class="fas fa-chart-bar"></i> Statistics
                    </h3>
                    <div id="stats-container" class="stats-box">
                        <div class="stat-row">
                            <span class="stat-label">Mean Value:</span>
                            <span class="stat-value" id="stat-mean">0.456</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Area (ha):</span>
                            <span class="stat-value" id="stat-area">12,450</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Std Dev:</span>
                            <span class="stat-value" id="stat-stddev">0.082</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Change:</span>
                            <span class="stat-value" id="stat-change">+2.3%</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="sidebar-section">
                    <button class="btn btn-primary" id="analyzeBtn">
                        <i class="fas fa-play"></i> Run Analysis
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> Reset Map
                    </button>
                </div>
            </aside>

            <!-- Main Map Area -->
            <main class="gis-main">
                <div id="map" class="gis-map"></div>
                
                <!-- Status Bar -->
                <div class="status-bar">
                    <span id="statusText">
                        <i class="fas fa-check-circle" style="color: var(--success);"></i>
                        Map loaded. Select a layer to begin analysis.
                    </span>
                </div>
            </main>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-overlay hidden">
        <div class="spinner">
            <div class="spinner-inner"></div>
        </div>
        <p>Analyzing forest data...</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-draw/1.0.4/leaflet.draw.min.js"></script>

    <script>
        // =========================================================================
        // FOREST GIS APPLICATION - JAVASCRIPT
        // =========================================================================
        
        // Constants
        const RTANJ_CENTER = [43.7719, 21.8944];
        const RTANJ_BOUNDS = [[43.7200, 21.8300], [43.8200, 21.9500]];
        const MAP_DEFAULT_ZOOM = 12;
        
        // Layer Statistics Database
        const layerStats = {
            ndvi: {
                name: 'NDVI - Normalized Difference Vegetation Index',
                description: 'Measures overall vegetation health and density',
                mean: 0.456,
                area: 12450,
                stddev: 0.082,
                change: '+2.3%',
                colors: ['#FFFFFF', '#F4D03F', '#27AE60', '#145A32'],
                labels: ['Low', 'High'],
                min: 0,
                max: 0.85,
                range: 'Low → High'
            },
            ndmi: {
                name: 'NDMI - Normalized Difference Moisture Index',
                description: 'Indicates vegetation water content and stress',
                mean: 0.289,
                area: 12450,
                stddev: 0.127,
                change: '-1.5%',
                colors: ['#8B4513', '#DAA520', '#3498DB', '#0047AB'],
                labels: ['Dry', 'Wet'],
                min: -0.5,
                max: 0.5,
                range: 'Dry → Wet'
            },
            nbr: {
                name: 'NBR - Normalized Burn Ratio',
                description: 'Identifies burned areas and vegetation disturbances',
                mean: 0.542,
                area: 12450,
                stddev: 0.095,
                change: '+0.8%',
                colors: ['#E74C3C', '#F4D03F', '#F8F9F9', '#2ECC71', '#1D8348'],
                labels: ['Burned', 'Healthy'],
                min: -0.1,
                max: 0.8,
                range: 'Burned → Healthy'
            },
            savi: {
                name: 'SAVI - Soil-Adjusted Vegetation Index',
                description: 'Accounts for soil reflectance in vegetation analysis',
                mean: 0.378,
                area: 12450,
                stddev: 0.091,
                change: '+1.9%',
                colors: ['#FFFFFF', '#F5B041', '#58D68D', '#1E8449'],
                labels: ['Low', 'High'],
                min: 0,
                max: 0.75,
                range: 'Low → High'
            },
            'forest-loss': {
                name: 'Forest Loss Detection',
                description: 'Areas showing deforestation and vegetation loss',
                mean: 0,
                area: 345,
                stddev: 0,
                change: '-3.2% YoY',
                colors: ['#FF1744', '#FF6E40'],
                labels: ['No Loss', 'Loss'],
                min: 0,
                max: 1,
                range: 'Stable → Loss'
            },
            'forest-gain': {
                name: 'Forest Gain Detection',
                description: 'Areas showing reforestation and vegetation growth',
                mean: 0,
                area: 523,
                stddev: 0,
                change: '+5.1% YoY',
                colors: ['#D500F9', '#7C4DFF'],
                labels: ['No Gain', 'Gain'],
                min: 0,
                max: 1,
                range: 'Stable → Gain'
            },
            deciduous: {
                name: 'Deciduous Forest',
                description: 'Broadleaf trees that lose leaves seasonally',
                mean: 0.512,
                area: 6820,
                stddev: 0.104,
                change: '+1.2%',
                colors: ['#90EE90', '#228B22'],
                labels: ['Low', 'High'],
                min: 0,
                max: 1,
                range: 'Low Density → High Density'
            },
            coniferous: {
                name: 'Coniferous Forest',
                description: 'Evergreen needle-leaved trees and conifers',
                mean: 0.678,
                area: 5630,
                stddev: 0.071,
                change: '+0.5%',
                colors: ['#006400', '#228B22'],
                labels: ['Low', 'High'],
                min: 0,
                max: 1,
                range: 'Low Density → High Density'
            }
        };
        
        // Initialize Map
        let map = L.map('map', {
            center: RTANJ_CENTER,
            zoom: MAP_DEFAULT_ZOOM,
            minZoom: 10,
            maxZoom: 18,
            zoomAnimation: true,
            fadeAnimation: true
        });
        
        // Basemap Layers
        const darkBasemap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CartoDB contributors',
            maxZoom: 20
        }).addTo(map);
        
        const satelliteBasemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri World Imagery',
            maxZoom: 20
        });
        
        // Layer Control
        const baseMaps = {
            'Dark Mode': darkBasemap,
            'Satellite': satelliteBasemap
        };
        
        L.control.layers(baseMaps).addTo(map);
        
        // Add Rtanj Mountain boundary
        const rtanjBoundary = L.rectangle(RTANJ_BOUNDS, {
            color: '#145A32',
            weight: 2,
            opacity: 0.8,
            fill: false,
            dashArray: '5, 5'
        }).addTo(map);
        
        // Bind popup to boundary
        rtanjBoundary.bindPopup('<strong>Rtanj Mountain</strong><br>Study Area Boundary');
        
        // Add Rtanj peak marker
        const rtanjPeak = L.circleMarker(RTANJ_CENTER, {
            radius: 8,
            fillColor: '#27AE60',
            color: '#145A32',
            weight: 2,
            opacity: 0.9,
            fillOpacity: 0.8
        }).addTo(map);
        
        rtanjPeak.bindPopup('<strong>Rtanj Peak</strong><br>2,191 m elevation<br>43.7719°N, 21.8944°E');
        
        // Feature group for dynamic layers
        let currentLayer = null;
        
        // =========================================================================
        // LAYER RENDERING FUNCTIONS
        // =========================================================================
        
        function createGradientLegend(colors, labels) {
            let html = '<div class="legend-gradient" style="background: linear-gradient(to right, ' + colors.join(', ') + ');"></div>';
            html += '<div class="legend-gradient-labels"><span>' + labels[0] + '</span><span>' + labels[1] + '</span></div>';
            return html;
        }
        
        function updateLegend(layerId) {
            const stats = layerStats[layerId];
            const container = document.getElementById('legend-container');
            
            let html = '<div class="legend-item">';
            html += '<strong style="color: var(--secondary-green); font-size: 12px; margin-bottom: 8px; display: block;">' + stats.name + '</strong>';
            html += '<small style="color: var(--text-secondary); display: block; margin-bottom: 12px;">' + stats.description + '</small>';
            
            if (layerId.includes('loss') || layerId.includes('gain')) {
                html += '<div class="legend-item">';
                html += '<div class="legend-color" style="background: ' + stats.colors[1] + ';"></div>';
                html += '<span class="legend-label">' + stats.labels[1] + ' Area</span>';
                html += '</div>';
            } else {
                html += createGradientLegend(stats.colors, [stats.labels[0], stats.labels[1]]);
                html += '<small style="color: var(--text-secondary); text-align: center; display: block;">Range: ' + stats.range + '</small>';
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function updateStatistics(layerId) {
            const stats = layerStats[layerId];
            document.getElementById('stat-mean').textContent = stats.mean.toFixed(3);
            document.getElementById('stat-area').textContent = stats.area.toLocaleString() + ' ha';
            document.getElementById('stat-stddev').textContent = stats.stddev.toFixed(3);
            document.getElementById('stat-change').textContent = stats.change;
        }
        
        function generateRandomRaster(layerId, intensity = 0.6) {
            // Create a visual representation of the raster layer
            const stats = layerStats[layerId];
            const numPoints = 80;
            const colors = stats.colors;
            
            for (let i = 0; i < numPoints; i++) {
                // Generate random points within Rtanj bounds
                const lat = RTANJ_CENTER[0] + (Math.random() - 0.5) * 0.1;
                const lng = RTANJ_CENTER[1] + (Math.random() - 0.5) * 0.15;
                
                // Random value between 0 and 1
                let value = Math.random() * intensity;
                
                // Get appropriate color from palette
                const colorIndex = Math.floor(value * (colors.length - 1));
                const color = colors[colorIndex];
                
                // Create circle marker
                const radius = 3 + Math.random() * 4;
                const circle = L.circleMarker([lat, lng], {
                    radius: radius,
                    fillColor: color,
                    color: color,
                    weight: 0.5,
                    opacity: 0.7,
                    fillOpacity: 0.6
                });
                
                circle.addTo(map);
                
                if (!currentLayer) currentLayer = [];
                currentLayer.push(circle);
                
                // Add value to popup
                circle.bindPopup(`<strong>${stats.name}</strong><br>Value: ${value.toFixed(3)}`);
            }
            
            // Add some specific zones for loss/gain
            if (layerId === 'forest-loss') {
                const lossZones = [
                    [[43.7500, 21.8500], 0.15],
                    [[43.7800, 21.9100], 0.12]
                ];
                
                lossZones.forEach(zone => {
                    const circle = L.circleMarker(zone[0], {
                        radius: 15 + Math.random() * 10,
                        fillColor: '#FF1744',
                        color: '#C41C3B',
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5
                    });
                    
                    circle.addTo(map);
                    if (!currentLayer) currentLayer = [];
                    currentLayer.push(circle);
                    circle.bindPopup(`<strong>Forest Loss Zone</strong><br>Area: ${(zone[1] * 1000).toFixed(0)} hectares`);
                });
            } else if (layerId === 'forest-gain') {
                const gainZones = [
                    [[43.7600, 21.8700], 0.20],
                    [[43.7900, 21.8900], 0.18]
                ];
                
                gainZones.forEach(zone => {
                    const circle = L.circleMarker(zone[0], {
                        radius: 12 + Math.random() * 8,
                        fillColor: '#D500F9',
                        color: '#9C27B0',
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0.5
                    });
                    
                    circle.addTo(map);
                    if (!currentLayer) currentLayer = [];
                    currentLayer.push(circle);
                    circle.bindPopup(`<strong>Forest Gain Zone</strong><br>Area: ${(zone[1] * 1000).toFixed(0)} hectares`);
                });
            }
        }
        
        function clearCurrentLayer() {
            if (currentLayer) {
                if (Array.isArray(currentLayer)) {
                    currentLayer.forEach(layer => map.removeLayer(layer));
                } else {
                    map.removeLayer(currentLayer);
                }
                currentLayer = null;
            }
        }
        
        function renderLayer(layerId) {
            clearCurrentLayer();
            currentLayer = [];
            
            // Simulate layer loading
            showLoading();
            
            setTimeout(() => {
                generateRandomRaster(layerId);
                updateLegend(layerId);
                updateStatistics(layerId);
                hideLoading();
                updateStatus('Layer rendered: ' + layerStats[layerId].name);
            }, 600);
        }
        
        // =========================================================================
        // UI INTERACTIONS
        // =========================================================================
        
        // Layer selection
        document.querySelectorAll('input[name="layer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                renderLayer(e.target.value);
            });
        });
        
        // Analyze button
        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const selectedLayer = document.querySelector('input[name="layer"]:checked').value;
            showLoading();
            
            setTimeout(() => {
                hideLoading();
                updateStatus('✅ Analysis complete for ' + layerStats[selectedLayer].name);
            }, 1500);
        });
        
        // Reset button
        document.getElementById('resetBtn').addEventListener('click', () => {
            clearCurrentLayer();
            map.setView(RTANJ_CENTER, MAP_DEFAULT_ZOOM);
            document.querySelector('input[name="layer"]').checked = true;
            updateStatus('Map reset to initial state');
        });
        
        // =========================================================================
        // UTILITY FUNCTIONS
        // =========================================================================
        
        function updateStatus(message) {
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = '<i class="fas fa-info-circle" style="color: var(--info);"></i>' + message;
        }
        
        function showLoading() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
        }
        
        function hideLoading() {
            document.getElementById('loadingIndicator').classList.add('hidden');
        }
        
        // =========================================================================
        // INITIALIZATION
        // =========================================================================
        
        // Initialize with default layer
        renderLayer('ndvi');
        
        // Add some instructional text
        updateStatus('Rtanj Mountain Forest Analysis Ready. Select a layer to begin.');
        
        // Handle window resize for responsive sidebar
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                map.invalidateSize();
            }, 250);
        });
        
        // Log initialization
        console.log('Forest GIS Application initialized');
        console.log('Map center:', RTANJ_CENTER);
        console.log('Available layers:', Object.keys(layerStats));
    </script>
</body>
</html>
